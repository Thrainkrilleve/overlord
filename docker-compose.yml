services:
  overlord:
    build: .
    container_name: discord-overlord
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Takes precedence over .env so the database always lives in the persistent ./data volume.
      # Schema migrations, including per-server settings, run when the container starts.
      - DATABASE_URL=sqlite:///app/data/overlord.db?mode=rwc
      # The process listens here. The host mapping below is loopback only.
      - DASHBOARD_BIND=0.0.0.0:8080
    ports:
      # Loopback only. DASHBOARD_HOST_PORT comes from the project .env (default 8080).
      # The process inside the container still listens on 8080.
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data

