name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Clippy & tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    # Reuses compiled dependencies between runs; first run is slow, later ones take a minute or two
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings

    - name: Run tests
      run: cargo test --locked

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Same build `docker compose up --build` runs, so a broken Dockerfile fails here first
    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
