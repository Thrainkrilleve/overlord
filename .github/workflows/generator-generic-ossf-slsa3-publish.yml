# Builds the release binary and publishes it with a signed SLSA level 3 provenance file, which
# proves the binary was built by this workflow from this repository's source.
#
# To release, push a version tag (do NOT create the release in the GitHub UI first):
#   git tag v0.1.0 && git push origin v0.1.0
# This repo uses immutable releases, so assets can't be added after a release is published.
# The workflow therefore builds and signs everything first, then creates the release with all
# files attached in one step.
#
# SLSA signing writes the repo name to Sigstore's public transparency log, so it only runs while
# the repository is public. Private-repo releases get the archive and a SHA256SUMS file only;
# provenance is added automatically once the repo is made public.
#
# Check a download wasn't corrupted (in the folder with both files):
#   sha256sum -c SHA256SUMS
#
# Verify provenance (public repo releases) with https://github.com/slsa-framework/slsa-verifier:
#   slsa-verifier verify-artifact overlord-<tag>-x86_64-linux.tar.gz \
#     --provenance-path overlord-<tag>-x86_64-linux.tar.gz.intoto.jsonl \
#     --source-uri github.com/Thrainkrilleve/overlord --source-tag <tag>

name: Release (SLSA provenance)
on:
  workflow_dispatch: # Builds and signs only; no release is created
  push:
    tags: [ "v*" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Pinned rather than ubuntu-latest: the binary needs glibc >= the build host's, and 24.04
    # (glibc 2.39) runs on Ubuntu 24.04+ including 26.04, and Debian 13
    runs-on: ubuntu-24.04
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="overlord-${TAG//\//-}-x86_64-linux"
          mkdir "$name"
          cp target/release/overlord .env.example README.md SETUP.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Generate subject for provenance
        id: hash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          echo "digests=$(sha256sum "$ARCHIVE" | base64 -w0)" >> "$GITHUB_OUTPUT"

      # Handed to the release job; also downloadable from manual runs
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false # Upload the .tar.gz as-is instead of zipping it again

  provenance:
    needs: [build]
    if: ${{ !github.event.repository.private }}
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      # The generator's upload-assets job declares contents: write, and GitHub refuses to start the
      # run if the caller grants less, even though that job is skipped (upload-assets: false)
      contents: write
    # Must be referenced by version tag, not commit SHA, for the provenance to verify
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      provenance-name: "${{ needs.build.outputs.archive }}.intoto.jsonl"
      # The release job attaches it instead: immutable releases can't take assets after publishing
      upload-assets: false

  release:
    needs: [build, provenance]
    # Provenance is skipped (not failed) on private repos; on public repos a signing failure
    # must block the release. `!cancelled()` lets this job run after a skipped dependency.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
          && needs.build.result == 'success'
          && (needs.provenance.result == 'success'
              || (needs.provenance.result == 'skipped' && github.event.repository.private)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # To create the release

    steps:
      - name: Download archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.archive }}

      - name: Download provenance
        if: needs.provenance.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}

      # With assets given, gh creates a draft, uploads them, then publishes, so the immutable
      # release is complete the moment it becomes visible
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
          PROVENANCE: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          set -euo pipefail
          sha256sum "$ARCHIVE" > SHA256SUMS
          assets=("$ARCHIVE" SHA256SUMS)
          if [ -n "$PROVENANCE" ]; then
            assets+=("$PROVENANCE")
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
