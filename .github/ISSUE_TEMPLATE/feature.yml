name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should Overlord do?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Mockups, related Discord behavior, or alternatives you considered.
