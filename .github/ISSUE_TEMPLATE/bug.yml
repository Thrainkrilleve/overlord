name: Bug report
description: Something is broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: If this is a security issue, do not file it here. Report it privately via SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit hash, tag, or "main".
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running Overlord?
      options:
        - Docker Compose
        - cargo run
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs. Redact DISCORD_TOKEN, other secrets, and other people's private messages.
      render: shell
